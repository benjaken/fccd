<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>你的登入驗證碼</title>
</head>
<body style="margin:0;padding:0;background:#f2f6f3;font-family:Arial,'PingFang HK','Microsoft JhengHei',sans-serif">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0">你的登入驗證碼</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f2f6f3">
    <tr>
      <td align="center" style="padding:28px 12px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(21,92,59,.10)">
          <tr><td style="height:7px;background:#1fa463;font-size:0;line-height:0">&nbsp;</td></tr>
          <tr>
            <td style="padding:26px 34px 18px;border-bottom:1px solid #e3ece7">
              <img src="https://www.foodchannels-delivery.com/assets/fc-catering-logo-email.png" width="190" alt="Food Channels Catering" style="display:block;width:190px;max-width:100%;height:auto;border:0">
            </td>
          </tr>
          <tr>
            <td style="padding:30px 34px 10px">
              <h1 style="margin:0;color:#123c2a;font-size:25px;line-height:1.35;font-weight:800">你的登入驗證碼</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 34px 20px">
              <div style="padding:24px 24px 6px;background:#f8fbf9;border:1px solid #dfeae4;border-radius:14px">
                <p style="margin:0 0 18px;color:#26352e;font-size:16px;line-height:1.7">請在客戶服務平台輸入以下 8 位驗證碼，以完成登入。</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center" style="padding:18px 0 24px"><p dir="ltr" style="margin:0;color:#165f3d;font-family:'Courier New',monospace;font-size:30px;line-height:40px;font-weight:700;letter-spacing:3px;white-space:nowrap">{{ .Token }}</p></td></tr></table>
<p style="margin:0 0 18px;color:#26352e;font-size:14px;line-height:1.7">驗證碼僅供本次登入使用，請勿向任何人透露。若已過期，請在登入頁重新發送。</p>
<p style="margin:0 0 18px;color:#26352e;font-size:14px;line-height:1.7">如你正在重設密碼，可<a href="{{ .ConfirmationURL }}" style="color:#165f3d;text-decoration:underline">按此重設密碼</a>。如你沒有提出登入或密碼重設要求，請忽略此電郵。此為系統自動發送的郵件，請勿直接回覆。</p>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:4px 34px 30px">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#eaf7ef;border-radius:14px">
                <tr>
                  <td style="padding:20px 22px" x-apple-data-detectors="false">
                    <p style="margin:0 0 12px;color:#123c2a;font-size:15px;font-weight:800">聯絡 Food Channels Catering</p>
                    <p style="margin:0 0 8px;line-height:1.6"><a href="https://wa.me/85253964335" style="color:#165f3d;font-size:14px;font-weight:700;text-decoration:none">WhatsApp (+852) 5396 4335</a></p>
                    <p style="margin:0 0 8px;line-height:1.6;color:#165f3d;font-size:14px;font-weight:700">(+852) 2185 7373</p>
                    <p style="margin:0 0 8px;line-height:1.6"><a href="mailto:sales@foodchannels-catering.com" style="color:#165f3d;font-size:14px;font-weight:700;text-decoration:none">sales@foodchannels-catering.com</a></p>
                    <p style="margin:0;line-height:1.6"><a href="https://www.foodchannels-catering.com" style="color:#165f3d;font-size:14px;font-weight:700;text-decoration:none">foodchannels-catering.com</a></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
