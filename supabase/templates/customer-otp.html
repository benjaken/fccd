<!doctype html>
<html lang="zh-Hant">
  <body style="font-family:Arial,sans-serif;color:#17251d;line-height:1.6">
    <h2>FCCD 電郵驗證碼</h2>
    <p>請在客戶服務平台輸入以下驗證碼：</p>
    <p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>

  </body>
</html>
