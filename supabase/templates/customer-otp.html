<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FCCD 登入驗證碼</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f8f5;color:#17251d;font-family:Arial,'Microsoft JhengHei',sans-serif;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">你的 FCCD 登入驗證碼已準備好，請返回客戶服務平台輸入。</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f8f5;">
      <tr><td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr><td style="padding:0 8px 22px;">
            <p style="margin:0;color:#087f3b;font-size:24px;font-weight:700;letter-spacing:2px;">FCCD</p>
            <p style="margin:6px 0 0;color:#65736a;font-size:13px;line-height:20px;">客戶服務平台 · Customer Service</p>
          </td></tr>
          <tr><td style="background-color:#ffffff;border:1px solid #dfe8e2;border-top:4px solid #087f3b;border-radius:12px;padding:32px 24px;">
            <h1 style="margin:0 0 12px;font-size:24px;line-height:34px;font-weight:700;">你的登入驗證碼</h1>
            <p style="margin:0;color:#65736a;font-size:15px;line-height:26px;">歡迎回來！請返回客戶服務平台，輸入以下 8 位驗證碼以完成登入。</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0;">
              <tr><td align="center" style="padding:22px 8px;background-color:#edf7f0;border:1px solid #d5eadb;border-radius:8px;">
                <p style="margin:0 0 10px;color:#467253;font-size:12px;line-height:18px;">登入驗證碼 / Verification code</p>
                <p dir="ltr" style="margin:0;color:#086b34;font-family:'Courier New',monospace;font-size:30px;line-height:40px;font-weight:700;letter-spacing:3px;white-space:nowrap;">{{ .Token }}</p>
              </td></tr>
            </table>
            <p style="margin:0;font-size:13px;line-height:23px;color:#65736a;">驗證碼僅供本次登入使用，請勿向任何人透露。若驗證碼已過期，請在登入頁重新發送。</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;border-top:1px solid #e7eee9;">
              <tr><td style="padding-top:20px;color:#65736a;font-size:13px;line-height:23px;">如你沒有提出登入要求，請忽略此電郵。</td></tr>
            </table>
          </td></tr>
          <tr><td align="center" style="padding:22px 12px 0;color:#7a867e;font-size:12px;line-height:21px;">FCCD 客戶服務平台<br>此為系統自動發送的郵件，請勿直接回覆。</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
